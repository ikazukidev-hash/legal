<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no, date=no, address=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>旅のしおり</title>
<meta property="og:title" content="旅のしおり">
<meta property="og:description" content="旅の行き先と時刻をまとめたしおりです。">
<style>
/* 旅のしおりを読むページ。行き先は URL の # より後ろに入っていて、このページは外へ何も送らない（外の字・絵・計測を読み込まない）。
   見た目は、アプリのテンプレート8種類の台紙に合わせる（色と決まりの出所は products/tabishiori/design/SPEC.md §17・§18）。 */
:root {
  color-scheme: light;
  --gothic: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  --maru: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ground: #F2F2F7; --sheet: #FFFFFF; --ink: #000000; --muted: #5E5E63; --seal: #A4262C;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--gothic); font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
h1, h2, p, ol, li { margin: 0; padding: 0; }
ol { list-style: none; }
svg { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.sheet { position: relative; max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 22px 16px calc(28px + env(safe-area-inset-bottom)); background: var(--sheet); }
.head { margin-bottom: 18px; }
.title { font-size: 22px; font-weight: 700; line-height: 1.35; }
.sub { margin-top: 2px; font-size: 14px; font-weight: 600; line-height: 1.5; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.day + .day { margin-top: 14px; }
.dayhead { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 17px; font-weight: 700; line-height: 1.4; }
.dayhead .cnt { margin-left: auto; font-size: 13px; font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
.spot { display: grid; grid-template-columns: 54px 1fr; column-gap: 12px; align-items: start; padding: 9px 0; }
.spot .mark { grid-column: 1; grid-row: 1 / span 3; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.spot .mark::after { content: attr(data-n); }
.title, .sub, .spot .name, .spot .time, .spot .memo, .dayhead { overflow: hidden; }
.spot .name { grid-column: 2; grid-row: 1; font-size: 17px; font-weight: 700; line-height: 1.45; }
.spot .time { grid-column: 2; grid-row: 2; font-size: 14px; font-weight: 600; line-height: 1.5; font-variant-numeric: tabular-nums; color: var(--muted); }
.spot .memo { grid-column: 2; grid-row: 3; margin-top: 2px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
.spot .num { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.nospot { padding: 10px 0; font-size: 15px; color: var(--muted); }
.imprint { display: flex; align-items: flex-end; justify-content: flex-end; gap: 8px; margin-top: 22px; font-size: 13px; font-weight: 600; line-height: 1.4; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.about { margin-top: 18px; font-size: 13px; line-height: 1.75; }
.about a { color: inherit; text-underline-offset: 3px; }
a:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; border-radius: 2px; }
.note { padding-top: 12vh; }
.note h1 { font-size: 22px; line-height: 1.4; }
.note p { margin-top: 10px; font-size: 16px; }
noscript p { max-width: 480px; margin: 0 auto; padding: 24px 16px; }

/* ---- 切手シート: 淡い青の紙に色の丸・赤い題の印・余白の色見本 */
[data-tpl="kitte"] .sheet {
  --sheet: #DCE6EF;
  background:
    radial-gradient(circle at calc(100% - 86px) 26px, #92B6E3 22px, transparent 22.5px) no-repeat,
    radial-gradient(circle at calc(100% - 44px) 68px, #F9E66E 64px, transparent 64.5px) no-repeat,
    radial-gradient(circle at 36px 80px, #92B6E3 80px, transparent 80.5px) 0 230px / 100% 880px repeat-y,
    radial-gradient(circle at calc(100% - 34px) 300px, #B4D98F 76px, transparent 76.5px) 0 230px / 100% 880px repeat-y,
    radial-gradient(circle at 48px 520px, #F9E66E 64px, transparent 64.5px) 0 230px / 100% 880px repeat-y,
    #DCE6EF;
}
[data-tpl="kitte"] .head { display: flex; align-items: center; gap: 12px; min-height: 76px; }
[data-tpl="kitte"] .dayhead .seal { flex: none; }
[data-tpl="kitte"] .spot .mark { width: 54px; height: 50px; position: relative; font-size: 19px; font-weight: 600; }
[data-tpl="kitte"] .spot .mark svg { position: absolute; inset: 0; }
[data-tpl="kitte"] .spot .mark::after { position: relative; }
[data-tpl="kitte"] .spot:nth-child(4n+1) .mark { color: #2B4A9A; }
[data-tpl="kitte"] .spot:nth-child(4n+2) .mark { color: #B3262D; }
[data-tpl="kitte"] .spot:nth-child(4n+3) .mark { color: #2E7D4F; }
[data-tpl="kitte"] .spot:nth-child(4n) .mark { color: #7A4A2B; }
[data-tpl="kitte"] .spot .time { color: #000; }
[data-tpl="kitte"] .imprint { justify-content: space-between; }
.marks { display: flex; gap: 4px; padding-bottom: 2px; }
.marks i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #fff; }

/* ---- スタンプ帳: 藍の布の表紙・題箋・桃色のページを藍の糸で綴じる */
[data-tpl="fuukei"] { --ground: #263A66; }
[data-tpl="fuukei"] body, body[data-tpl="fuukei"] { background: #263A66; }
[data-tpl="fuukei"] .sheet {
  color: #000;
  background:
    repeating-linear-gradient(45deg, transparent 0 3.2px, #314877 3.2px 3.7px),
    repeating-linear-gradient(-45deg, transparent 0 3.2px, #314877 3.2px 3.7px),
    #263A66;
}
.slip { display: inline-block; max-width: 100%; padding: 10px 14px; background: #fff; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px var(--slip, #263A66), inset 0 0 0 6px #fff, inset 0 0 0 6.5px var(--slip, #263A66); }
.slip .title { font-family: var(--maru); font-weight: 600; }
.slip .sub { color: #5E5E63; }
[data-tpl="fuukei"] .day {
  padding: 4px 12px 8px 20px; border-radius: 6px;
  background:
    linear-gradient(#2B3A67, #2B3A67) 6px 0 / 1.4px 100% no-repeat,
    linear-gradient(#2B3A67, #2B3A67) 0 8% / 7px 1.4px no-repeat,
    linear-gradient(#2B3A67, #2B3A67) 0 36% / 7px 1.4px no-repeat,
    linear-gradient(#2B3A67, #2B3A67) 0 64% / 7px 1.4px no-repeat,
    linear-gradient(#2B3A67, #2B3A67) 0 92% / 7px 1.4px no-repeat,
    #F6E2DD;
}
[data-tpl="fuukei"] .dayhead { border-bottom: 1px solid rgba(60, 60, 67, .29); }
[data-tpl="fuukei"] .dayhead .cnt { color: #5E5E63; }
[data-tpl="fuukei"] .spot .mark { width: 50px; height: 50px; border: 1.4px dashed #5E5E63; border-radius: 50%; font-size: 18px; font-weight: 600; }
[data-tpl="fuukei"] .spot:nth-child(3n+1) .mark { color: #B3262D; }
[data-tpl="fuukei"] .spot:nth-child(3n+2) .mark { color: #2B4A9A; }
[data-tpl="fuukei"] .spot:nth-child(3n) .mark { color: #2E7D4F; }
[data-tpl="fuukei"] .imprint, [data-tpl="fuukei"] .about { color: rgba(255, 255, 255, .92); }

/* ---- インスタント写真: アルバムの黒い台紙・白い色鉛筆の書き込み */
body[data-tpl="instant"] { background: #2B2A28; }
[data-tpl="instant"] .sheet { --sheet: #2B2A28; --ink: #EDEAE4; --muted: #C9C6C0; color: #EDEAE4; }
[data-tpl="instant"] .title { display: inline; font-family: var(--maru); font-weight: 400; font-size: 23px; padding-bottom: 3px; background: linear-gradient(rgba(237, 234, 228, .75), rgba(237, 234, 228, .75)) 0 100% / 100% 1.4px no-repeat; }
[data-tpl="instant"] .sub { margin-top: 8px; font-family: var(--maru); font-weight: 400; color: #D5D2CC; }
[data-tpl="instant"] .dayhead { border-bottom: 1.2px solid rgba(237, 234, 228, .5); }
[data-tpl="instant"] .dayhead .cnt { color: #D5D2CC; }
[data-tpl="instant"] .spot .mark { width: 46px; height: 56px; align-items: start; padding-top: 3px; background: #fff; box-shadow: 0 0 0 1px #86868B; color: #5E5E63; font-size: 16px; font-weight: 600; }
[data-tpl="instant"] .spot .mark::after { display: grid; place-items: center; width: 40px; height: 39px; background: #E4E4E7; }
[data-tpl="instant"] .spot:nth-child(odd) .mark { transform: rotate(-2.2deg); }
[data-tpl="instant"] .spot:nth-child(even) .mark { transform: rotate(1.6deg); }
[data-tpl="instant"] .spot .name { font-family: var(--maru); font-weight: 400; font-size: 18px; }

/* ---- パスポート: 紺の表紙に金の箔・査証のページ */
body[data-tpl="passport"] { background: #1B2A4A; }
[data-tpl="passport"] .sheet { --sheet: #1B2A4A; }
[data-tpl="passport"] .head { color: #CBAA52; }
[data-tpl="passport"] .title { font-family: var(--gothic); font-weight: 600; font-size: 23px; letter-spacing: .08em; }
[data-tpl="passport"] .sub { letter-spacing: .07em; }
[data-tpl="passport"] .day {
  padding: 2px 12px 8px; border-radius: 8px;
  background:
    repeating-radial-gradient(ellipse 140% 60px at 50% -20px, transparent 0 22px, #C2CEDA 22px 22.8px),
    #DDE5EC;
}
[data-tpl="passport"] .dayhead .visas { font-size: 12px; font-weight: 400; letter-spacing: .14em; color: #4A5A74; white-space: nowrap; }
[data-tpl="passport"] .dayhead .cnt { position: relative; display: grid; place-items: center; width: 34px; height: 34px; color: #DDE5EC; font-weight: 700; }
[data-tpl="passport"] .dayhead .cnt svg { position: absolute; inset: 0; }
[data-tpl="passport"] .dayhead .cnt span { position: relative; }
[data-tpl="passport"] .spot .mark { width: 54px; height: 44px; border: 1.2px dashed #4A5A74; color: #1F2A44; font-size: 18px; font-weight: 600; }
[data-tpl="passport"] .imprint, [data-tpl="passport"] .about { color: #CBAA52; }

/* ---- きっぷ: 表紙の券と、1か所ずつの券 */
[data-tpl="kippu"] .sheet { --ink: #1F2A44; color: #1F2A44; }
.ticket {
  border: 1px solid #9AA7AD; border-top: 3px solid #C8362D;
  background:
    repeating-linear-gradient(45deg, transparent 0 7.9px, #D2E0E5 7.9px 8.6px),
    repeating-linear-gradient(-45deg, transparent 0 7.9px, #D2E0E5 7.9px 8.6px),
    #E4EDF0;
}
[data-tpl="kippu"] .head { padding: 8px 10px 7px; font-family: var(--gothic); }
[data-tpl="kippu"] .head .tags { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; line-height: 1; }
[data-tpl="kippu"] .head .tags .maru { display: grid; place-items: center; width: 20px; height: 20px; border: 1px solid; border-radius: 50%; }
[data-tpl="kippu"] .head .tags .hako { padding: 3px 3px 3px 6px; border: 1px solid; letter-spacing: .2em; }
[data-tpl="kippu"] .title { margin-top: 6px; padding-bottom: 3px; border-bottom: 2px solid; font-family: var(--gothic); font-weight: 600; letter-spacing: .08em; }
[data-tpl="kippu"] .sub { margin-top: 6px; font-family: var(--gothic); font-weight: 400; letter-spacing: 0; }
[data-tpl="kippu"] .head .issue { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 13px; line-height: 1.4; }
[data-tpl="kippu"] .head .issue b { font-family: var(--gothic); font-weight: 600; color: #B32B23; font-variant-numeric: tabular-nums; }
[data-tpl="kippu"] .dayhead .cnt { color: #46525A; }
[data-tpl="kippu"] .spot { position: relative; grid-template-columns: 28px 1fr; column-gap: 8px; margin: 8px 0; padding: 8px 10px 8px 0; }
[data-tpl="kippu"] .spot .mark { grid-row: 1 / span 4; align-self: stretch; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
[data-tpl="kippu"] .spot .mark::after { content: attr(data-date); }
[data-tpl="kippu"] .spot .name { padding-bottom: 2px; border-bottom: 2px solid; font-family: var(--gothic); font-weight: 600; font-size: 18px; letter-spacing: .08em; }
[data-tpl="kippu"] .spot .name::before { content: attr(data-n); display: inline-block; margin-right: 7px; padding: 0 3px; border: 1px solid; font-family: var(--gothic); font-size: 13px; font-weight: 600; letter-spacing: 0; line-height: 1.5; vertical-align: 2px; font-variant-numeric: tabular-nums; }
[data-tpl="kippu"] .spot .time { margin-top: 4px; font-size: 17px; font-weight: 700; color: #1F2A44; }
[data-tpl="kippu"] .spot .memo { font-family: var(--gothic); }
[data-tpl="kippu"] .spot .serial { grid-column: 2; grid-row: 4; margin-top: 2px; font-family: var(--gothic); font-size: 13px; line-height: 1.5; color: #46525A; }

/* ---- 絵はがき: アルバムの灰緑の台紙・貼った札・切れ込みに差したはがき */
body[data-tpl="postcard"] { background: #8C9478; }
[data-tpl="postcard"] .sheet { --sheet: #8C9478; --ink: #1A2016; --muted: #1A2016; --slip: #1F2D3A; color: #1A2016; }
[data-tpl="postcard"] .slip { transform: rotate(-1.2deg); background: #F7F7F4; box-shadow: inset 0 0 0 3px #F7F7F4, inset 0 0 0 4px #1F2D3A, inset 0 0 0 6px #F7F7F4, inset 0 0 0 6.5px #1F2D3A; color: #1F2D3A; }
[data-tpl="postcard"] .slip .sub { color: #46525A; }
[data-tpl="postcard"] .spot { grid-template-columns: 64px 1fr; }
[data-tpl="postcard"] .spot .mark { position: relative; width: 64px; height: 46px; background: #F7F7F4; box-shadow: 0 0 0 1px #A9ABAE; color: #1F2D3A; font-size: 17px; font-weight: 600; }
[data-tpl="postcard"] .spot .mark::before { content: ""; position: absolute; inset: 4px; border: 1px dashed #7A7F85; }
[data-tpl="postcard"] .spot .mark::after { position: relative; }
[data-tpl="postcard"] .spot .mark i { position: absolute; inset: -1px; background: linear-gradient(135deg, #8C9478 6px, transparent 6.4px), linear-gradient(225deg, #8C9478 6px, transparent 6.4px), linear-gradient(315deg, #8C9478 6px, transparent 6.4px), linear-gradient(45deg, #8C9478 6px, transparent 6.4px); }
[data-tpl="postcard"] .spot .name { font-family: var(--maru); font-weight: 600; font-size: 18px; letter-spacing: .03em; }

/* ---- 時刻表: 白い誌面・紺の帯・時刻の列 */
[data-tpl="jikoku"] .sheet { --navy: #1D3A8A; }
[data-tpl="jikoku"] .head .row { display: flex; align-items: center; gap: 8px; }
[data-tpl="jikoku"] .head .box { flex: none; padding: 2px 6px; border: 1.2px solid var(--navy); border-radius: 3px; color: var(--navy); font-size: 13px; font-weight: 700; line-height: 1.5; white-space: nowrap; }
[data-tpl="jikoku"] .title { flex: 1; padding: 6px 12px; border-radius: 7px; background: var(--navy); color: #fff; font-size: 18px; font-weight: 800; letter-spacing: .08em; text-align: center; }
[data-tpl="jikoku"] .sub { margin-top: 7px; color: var(--navy); text-align: center; }
[data-tpl="jikoku"] .dayhead { padding: 0 12px; border-radius: 8px; background: var(--navy); color: #fff; }
[data-tpl="jikoku"] .dayhead .cnt { font-size: 14px; font-weight: 600; }
[data-tpl="jikoku"] .spots { margin-top: 5px; border-top: 4px double #000; }
[data-tpl="jikoku"] .spot { grid-template-columns: 62px 14px 1fr 40px; column-gap: 0; align-items: center; min-height: 54px; padding: 6px 0; border-bottom: 1px solid rgba(60, 60, 67, .29); position: relative; }
[data-tpl="jikoku"] .spot .mark { display: none; }
[data-tpl="jikoku"] .spot .time { grid-column: 1; grid-row: 1 / span 2; padding-right: 6px; font-size: 21px; font-weight: 600; color: #000; text-align: right; white-space: nowrap; }
[data-tpl="jikoku"] .spot::before { content: ""; grid-column: 2; grid-row: 1 / span 2; align-self: stretch; justify-self: center; width: 2px; margin: -6px 0; background: var(--navy); }
[data-tpl="jikoku"] .spot::after { content: ""; grid-column: 2; grid-row: 1 / span 2; justify-self: center; width: 10px; height: 10px; border: 2.5px solid var(--navy); border-radius: 50%; background: #fff; }
[data-tpl="jikoku"] .spot .name { grid-column: 3; grid-row: 1; padding-left: 8px; font-size: 18px; }
[data-tpl="jikoku"] .spot .memo { grid-column: 3; grid-row: 2; padding-left: 8px; }
[data-tpl="jikoku"] .spot .num { position: static; width: 40px; height: 40px; clip-path: none; overflow: visible; grid-column: 4; grid-row: 1 / span 2; display: grid; place-items: center; border: 1.5px solid var(--navy); border-radius: 4px; color: var(--navy); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
[data-tpl="jikoku"] .imprint { justify-content: space-between; color: var(--navy); }
[data-tpl="jikoku"] .imprint .legend { font-weight: 400; letter-spacing: 0; }

/* ---- フィルム: 印画紙の上の黒い帯・記入欄 */
body[data-tpl="contact"] { background: #E9E9E4; }
[data-tpl="contact"] .sheet { --sheet: #E9E9E4; --ink: #1C1C1E; color: #1C1C1E; }
[data-tpl="contact"] .head { border-top: 2.5px solid #1C1C1E; border-bottom: 1px solid #1C1C1E; }
[data-tpl="contact"] .field { padding: 3px 0 2px; }
[data-tpl="contact"] .field + .fields { border-top: 1px solid #1C1C1E; }
[data-tpl="contact"] .fields { display: flex; }
[data-tpl="contact"] .fields .field { flex: 1; }
[data-tpl="contact"] .fields .field + .field { flex: none; width: 96px; padding-left: 8px; border-left: 1px solid #1C1C1E; }
[data-tpl="contact"] .label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .14em; line-height: 1.4; }
[data-tpl="contact"] .title { font-family: var(--maru); font-weight: 400; font-size: 21px; color: #1F2D5A; }
[data-tpl="contact"] .sub { margin: 0; font-family: var(--maru); font-weight: 400; font-size: 15px; color: #1F2D5A; }
[data-tpl="contact"] .day { padding: 8px 12px 10px; border-radius: 3px; background: #0B0B0C; color: #fff; }
[data-tpl="contact"] .dayhead { display: block; min-height: 0; padding-bottom: 14px; font-family: var(--mono); font-size: 14px; color: #F4A640; background: radial-gradient(circle at 3px 4px, #C8412F 2.6px, transparent 3px) 0 100% / 11px 8px repeat-x; }
[data-tpl="contact"] .dayhead .cnt { float: right; font-size: 14px; color: #F4A640; }
[data-tpl="contact"] .spot .mark { width: 54px; height: 36px; margin-top: 4px; border: 1px solid #7A5520; border-radius: 2px; background: #17171A; color: #F4A640; font-size: 17px; font-weight: 600; }
[data-tpl="contact"] .spot .time { grid-row: 1; font-family: var(--mono); font-size: 13px; font-weight: 400; color: #F4A640; }
[data-tpl="contact"] .spot .name { grid-row: 2; }
[data-tpl="contact"] .spot .memo { color: #E2E2E2; }
[data-tpl="contact"] .imprint { justify-content: space-between; }
[data-tpl="contact"] .imprint .brand { font-family: var(--mono); letter-spacing: 0; }
</style>
</head>
<body data-tpl="kitte">
<noscript><p>このページは、URL の中に入っている旅のしおりを表示します。表示には JavaScript が必要です。</p></noscript>
<main id="app" class="sheet"></main>

<script id="core">
// URL の中のしおりを読む部分（画面には触らない）。形式はアプリの ShareLink（Core/Sources/TabiCore/ShareLink.swift）と同じ:
// base64url →［版 1byte］［圧縮 0/1 1byte］［圧縮のときは元の長さ varint］本体。本体は 題・開始日・日ごとの行き先（名前・時刻・メモ）。
var Shiori = (function () {
  'use strict';
  var LIMIT = { payload: 8192, raw: 65536, spots: 300, days: 60, title: 80, name: 60, memo: 200 };

    var mark = el('span', 'mark'); mark.setAttribute('aria-hidden', 'true'); mark.setAttribute('data-n', no);
    if (tpl === 'kitte') mark.appendChild(stamp());
    if (tpl === 'postcard') mark.appendChild(el('i'));
    if (tpl === 'kippu') { var x = Shiori.dateOf(trip.start, d); mark.setAttribute('data-date', String(x.y).slice(-2) + '.' + Shiori.two(x.m) + '.' + Shiori.two(x.d)); }
    li.appendChild(mark);
    li.appendChild(el('span', 'num', no));
    var name = el('span', 'name', s.name); name.setAttribute('data-n', no);
    var time = el('span', 'time', Shiori.clock(s.minutes)); time.setAttribute('data-n', no);
    if (s.minutes === null) time.setAttribute('aria-label', '時刻なし');
    // 読み上げの順は 番号・時刻・名前・メモ。見た目の順は CSS が決める
    li.appendChild(time);
    li.appendChild(name);
    if (s.memo) li.appendChild(el('p', 'memo', s.memo));
    if (tpl === 'kippu') { var ser = el('span', 'serial', '記念券　' + no + '／' + Shiori.two(all)); ser.setAttribute('aria-hidden', 'true'); li.appendChild(ser); }
    return li;
  }

  function imprint(tpl, trip) {
    var p = el('p', 'imprint');
    p.setAttribute('aria-hidden', 'true');
    if (tpl === 'kippu') return null;
    if (tpl === 'kitte') {
      var m = el('span', 'marks');
      ['#2B4A9A', '#B3262D', '#2E7D4F', '#7A4A2B', '#F9E66E', '#92B6E3'].forEach(function (c) { var i = el('i'); i.style.background = c; m.appendChild(i); });
      p.appendChild(m);
    }
    if (tpl === 'jikoku') p.appendChild(el('span', 'legend', '――　時刻なし'));
    if (tpl === 'contact') p.appendChild(el('span', 'brand', 'TABI 400'));
    p.appendChild(el('span', '', 'ぺたしおり　' + endDate(trip)));
    return p;
  }

  function about() {
    var p = el('p', 'about');
    p.appendChild(document.createTextNode('iPhone アプリ「ぺたしおり」の旅のしおりを表示するページです。内容は、この URL を作った人が書いたものです（アプリの作者は内容を確かめていません）。旅の名前・行き先・時刻・メモは URL の中に入っていて、サーバーには保存していません。この URL を受け取った人は、同じ内容を見られます。'));
    var a = el('a', '', 'プライバシーポリシー');
    a.href = './';
    p.appendChild(document.createTextNode(' '));
    p.appendChild(a);
    return p;
  }

  // 中身の入れ替え（古いブラウザにも入っている機能だけで）
  function setChildren(parent, nodes) {
    while (parent.firstChild) parent.removeChild(parent.firstChild);
    for (var i = 0; i < nodes.length; i++) parent.appendChild(nodes[i]);
  }

  function note(title, lines) {
    document.body.setAttribute('data-tpl', 'kitte');
    document.title = '旅のしおり';
    var box = el('div', 'note');
    box.appendChild(el('h1', '', title));
    lines.forEach(function (t) { box.appendChild(el('p', '', t)); });
    setChildren(app, [box, about()]);
  }

  function render() {
    var trip;
    try {
      trip = Shiori.decode(location.href);
    } catch (e) {
      if (e.kind === 'empty') return note('旅のしおり', ['QRコードを読み取ると、ここに旅のしおりが表示されます。']);
      if (e.kind === 'unsupported') return note('しおりを開けませんでした', ['新しい形式のしおりです。このページを読み込み直してから、もう一度開いてください。']);
      return note('しおりを開けませんでした', ['URL が途中で切れているかもしれません。QRコードをもう一度読み取ってください。']);
    }
    var tpl = Shiori.theme(trip.template), all = total(trip), number = 0;
    document.body.setAttribute('data-tpl', tpl);
    document.title = (trip.title ? trip.title + ' | ' : '') + '旅のしおり';
    var nodes = [head(tpl, trip)];
    trip.days.forEach(function (spots, d) {
      var sec = el('section', 'day');
      sec.appendChild(dayHead(tpl, trip, d, spots));
      if (spots.length === 0) {
        sec.appendChild(el('p', 'nospot', '行き先はまだありません'));
      } else {
        var ol = el('ol', 'spots');
        spots.forEach(function (s) { number += 1; ol.appendChild(spotRow(tpl, trip, d, s, number, all)); });
        sec.appendChild(ol);
      }
      nodes.push(sec);
    });
    var im = imprint(tpl, trip);
    if (im) nodes.push(im);
    nodes.push(about());
    setChildren(app, nodes);
  }

  // どこかで失敗しても、白い画面のままにしない
  function show() {
    try {
      render();
    } catch (e) {
      try { note('しおりを開けませんでした', ['このブラウザでは表示できませんでした。ほかのブラウザで開いてください。']); }
      catch (e2) { app.textContent = 'しおりを開けませんでした。ほかのブラウザで開いてください。'; }
    }
  }

  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
